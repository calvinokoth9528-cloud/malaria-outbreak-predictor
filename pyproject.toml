[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "malaria-outbreak-predictor"
version = "1.0.0"
description = "KEMRI-inspired ML system for predicting malaria outbreak risk in Kenya"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Calvin Omondi Okoth", email = "calvinokoth9528@gmail.com"},
]
requires-python = ">=3.10"
keywords = ["malaria", "machine-learning", "public-health", "kenya", "kemri", "epidemiology"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "joblib>=1.3",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "fastapi>=0.100",
    "uvicorn[standard]>=0.23",
    "pydantic>=2.0",
    "streamlit>=1.28",
    "plotly>=5.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "httpx>=0.25",
    "ruff>=0.1",
]

[project.urls]
Homepage = "https://github.com/calvinokoth9528-cloud/malaria-outbreak-predictor"
Repository = "https://github.com/calvinokoth9528-cloud/malaria-outbreak-predictor"
Issues = "https://github.com/calvinokoth9528-cloud/malaria-outbreak-predictor/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]
