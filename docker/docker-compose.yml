# ==============================================================================
# Malaria Outbreak Predictor — Docker Compose
# ==============================================================================
# Run: docker-compose up
# API: http://localhost:8000/docs
# Dashboard: http://localhost:3838
# ==============================================================================

version: "3.8"

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: python-stage
    ports:
      - "8000:8000"
    volumes:
      - ../models/serialized:/app/models/serialized:ro
      - ../data/processed:/app/data/processed:ro
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  dashboard:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: r-stage
    ports:
      - "3838:3838"
    volumes:
      - ../data/processed:/srv/shiny-server/malaria-predictor/data/processed:ro

  # Combined production image
  production:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: production
    ports:
      - "8000:8000"
      - "3838:3838"
    volumes:
      - ../models/serialized:/app/models/serialized:ro
      - ../data/processed:/app/data/processed:ro
    environment:
      - PYTHONUNBUFFERED=1
    profiles:
      - full
